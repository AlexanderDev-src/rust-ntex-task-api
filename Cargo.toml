[package]
name = "restapi"
version = "0.1.0"
edition = "2024"

[dependencies]
ntex = { version = "3.12.3", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
